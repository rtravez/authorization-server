<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth Server</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #f8f9fa 0%, #eef3ff 100%);
        }

        .hero {
            padding: 5rem 0;
        }

        .status-card {
            max-width: 500px;
        }
    </style>
</head>
<body>
    <main class="container hero">
        <div class="row align-items-center min-vh-100">
            <div class="col-lg-7">
                <span class="badge bg-primary-subtle text-primary-emphasis mb-3 px-3 py-2 rounded-pill">Auth Server</span>
                <h1 class="display-4 fw-bold mb-3">Servidor de autorización listo</h1>
                <p class="lead text-muted mb-4">
                    El sistema de autenticación y autorización está disponible para gestionar acceso seguro
                    a tus aplicaciones con OAuth 2.0 y OpenID Connect.
                </p>
                <div class="d-flex flex-wrap gap-3">
                    <a href="/authServices/login" class="btn btn-primary btn-lg">Iniciar sesión</a>
                    <a href="#status" class="btn btn-outline-primary btn-lg">Ver estado</a>
                </div>
            </div>
            <div class="col-lg-5">
                <div id="status" class="card shadow-sm border-0 status-card mx-auto">
                    <div class="card-body p-4">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h2 class="h5 mb-0">Estado del servicio</h2>
                            <span class="badge bg-success-subtle text-success-emphasis">Online</span>
                        </div>
                        <ul class="list-group list-group-flush">
                            <li class="list-group-item d-flex justify-content-between align-items-center px-0">
                                <span>API</span>
                                <span class="badge text-bg-light">OK</span>
                            </li>
                            <li class="list-group-item d-flex justify-content-between align-items-center px-0">
                                <span>Autenticación</span>
                                <span class="badge text-bg-light">OK</span>
                            </li>
                            <li class="list-group-item d-flex justify-content-between align-items-center px-0">
                                <span>OAuth/OIDC</span>
                                <span class="badge text-bg-light">Activo</span>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
