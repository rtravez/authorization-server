<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{login.title}">Iniciar sesión | Auth Server</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        body {
            min-height: 100vh;
            background: #f8f9fa;
        }

        .login-shell {
            max-width: 1100px;
            padding-top: 2rem;
            padding-bottom: 2rem;
        }

        .brand-panel {
            min-height: 620px;
        }

        @media (max-width: 767.98px) {
            .brand-panel {
                min-height: auto;
            }
        }
    </style>
</head>

<body class="d-flex align-items-center py-4 bg-light">
    <main class="container login-shell">
        <div class="row g-0 shadow-lg overflow-hidden rounded-4">
            <section class="col-md-5 bg-dark text-white d-flex flex-column justify-content-between p-5 brand-panel">
                <div>
                    <div class="brand-mark fw-bold text-uppercase" th:text="#{login.brand}">AUTH SERVER</div>
                    <div class="mt-5 display-6 fw-semibold" th:text="#{login.tagline}">Tu identidad, bajo tu control.</div>
                    <p class="mt-3 mb-0 text-white-50" th:text="#{login.description}">Accede de forma segura para continuar con la aplicación.</p>
                </div>
                <small class="text-white-50" th:text="#{login.protocols}">OAuth 2.0 · OpenID Connect</small>
            </section>
            <section class="col-md-7 bg-white d-flex align-items-center p-5">
                <div class="w-100" style="max-width: 420px; margin: auto;">
                    <div class="text-primary text-uppercase fw-bold mb-2" style="letter-spacing: 0.15rem; font-size: 0.75rem;"
                        th:text="#{login.welcome}">Bienvenido</div>
                    <h1 class="h2 fw-bold mb-2" th:text="#{login.heading}">Iniciar sesión</h1>
                    <p class="text-muted mb-4" th:text="#{login.instructions}">Ingresa tus credenciales para continuar.</p>

                    <div th:if="${param.error}" class="alert alert-danger" role="alert">
                        <span th:text="#{login.error}">Usuario o contraseña incorrectos.</span>
                    </div>
                    <div th:if="${param.logout}" class="alert alert-success" role="alert">
                        <span th:text="#{login.logout}">Has cerrado sesión correctamente.</span>
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label fw-semibold"
                                th:text="#{login.username}">Usuario</label>
                            <input type="text" class="form-control" id="username" name="username"
                                autocomplete="username" th:placeholder="#{login.username.placeholder}"
                                placeholder="Ingresa tu usuario" required autofocus>
                        </div>
                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold"
                                th:text="#{login.password}">Contraseña</label>
                            <input type="password" class="form-control" id="password" name="password"
                                autocomplete="current-password" th:placeholder="#{login.password.placeholder}"
                                placeholder="Ingresa tu contraseña" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 fw-semibold"
                            th:text="#{login.submit}">Continuar</button>
                    </form>
                </div>
            </section>
        </div>
    </main>
</body>

</html>
